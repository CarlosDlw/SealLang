[package]
name = "seal-llvm-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# This crate deliberately does not inherit the workspace lints: it exists only
# to call the LLVM APIs that inkwell 0.11 exposes unsafely or mis-wraps. The
# unsafe blocks are confined here so every compiler crate keeps
# `unsafe_code = "forbid"`.
[dependencies]
inkwell = { version = "0.11.0", default-features = false, features = ["llvm23-1", "target-all"] }
llvm-sys = { version = "231.0.2", default-features = false }

[lints.rust]
missing_docs = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"
