[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
seal-index = { path = "crates/index" }
seal-hash = { path = "crates/hash" }
seal-macros = { path = "crates/macros" }
seal-symbol = { path = "crates/symbol" }
seal-unicode = { path = "crates/unicode" }
seal-span = { path = "crates/span" }
seal-lexer = { path = "crates/lexer" }
seal-ast = { path = "crates/ast" }
seal-parser = { path = "crates/parser" }
seal-ty = { path = "crates/ty" }
seal-def = { path = "crates/def" }
seal-hir = { path = "crates/hir" }
seal-typeck = { path = "crates/typeck" }
seal-mir = { path = "crates/mir" }
seal-const-eval = { path = "crates/const-eval" }
seal-methods = { path = "crates/methods" }
seal-borrowck = { path = "crates/borrowck" }
seal-mono = { path = "crates/mono" }
seal-codegen = { path = "crates/codegen" }
seal-layout = { path = "crates/layout" }
seal-llvm-ffi = { path = "crates/llvm-ffi" }
seal-diagnostics = { path = "crates/diagnostics" }
seal-error-codes = { path = "crates/error-codes" }
seal-version = { path = "crates/version" }
seal-target = { path = "crates/target" }
seal-toolchain = { path = "crates/toolchain" }
seal-fs = { path = "crates/fs" }
seal-profiling = { path = "crates/profiling" }
seal-session = { path = "crates/session" }
seal-query = { path = "crates/query" }
seal-test = { path = "crates/test" }
seal-test-support = { path = "crates/test-support" }
seal-plan = { path = "crates/plan" }
seal-manifest = { path = "crates/manifest" }
seal-project = { path = "crates/project" }
seal-registry = { path = "crates/registry" }
seal-registry-server = { path = "crates/registry-server" }
seal-api = { path = "crates/api" }
seal-doc = { path = "crates/doc" }
seal-driver = { path = "crates/driver" }
seal-cli = { path = "crates/cli" }
seal-cas = { path = "crates/cas" }
seal-sandbox = { path = "crates/sandbox" }
seal-build = { path = "crates/build" }
seal-remote = { path = "crates/remote" }
seal-remote-server = { path = "crates/remote-server" }
seal-metadata = { path = "crates/metadata" }
blake3 = "1.8"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
pubgrub = "0.3"
version-ranges = { version = "0.1", features = ["semver"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
tar = "0.4"
zstd = "0.13"
url = "2.5"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.23"
redb = "2.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16"
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12.3", default-features = false, features = ["transport", "codegen", "prost"] }
tokio = "1.48"
tokio-stream = { version = "0.1", default-features = false }

clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5.3"
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
semver = "1.0"
globset = "0.4"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
unicode-ident = "1.0"
unicode-width = "0.2"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 1
