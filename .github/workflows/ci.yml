name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the build environment
        uses: ./.github/actions/setup
        with:
          llvm: "false"
          bubblewrap: "false"
          cache: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Build the workspace
        run: cargo build --workspace --locked

  test:
    name: Test
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Run the workspace tests
        run: cargo test --workspace --locked

  reproducibility:
    name: Reproducibility
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Build the same project twice and compare the artifacts
        run: cargo run --locked -p seal-cli -- --project examples/multi-module verify-repro
